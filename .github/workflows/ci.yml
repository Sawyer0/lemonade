name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck (web + packages)
        run: npm run typecheck

      - name: Typecheck (mobile)
        run: npm run typecheck:mobile

      - name: Typecheck (agent)
        run: npm run typecheck:agent

      - name: Typecheck (functions)
        run: npm run typecheck:functions

      - name: Build functions and load the compiled entry
        env:
          GCLOUD_PROJECT: demo-lemonade
          FIREBASE_CONFIG: '{"projectId":"demo-lemonade","storageBucket":"demo-lemonade.appspot.com"}'
          LLM_PROVIDER: offline
        run: |
          npm --workspace functions run build
          node -e 'const fns = require("./functions"); console.log("exports:", Object.keys(fns).join(", "))'

      - name: Test with coverage (web, packages, agent)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["## Coverage", "| Metric | % | Covered |", "|---|---|---|", ...["statements","branches","functions","lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Test (mobile)
        run: npm run test:mobile

      - name: Test (mobile config plugins)
        run: npm --workspace mobile run test:plugins -- --ci

      - name: Build
        run: npm run build

  smoke:
    name: Runtime smoke (next start + Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-14

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npx --yes firebase-tools@14 emulators:exec --only auth,firestore --project demo-lemonade "npm run test:smoke"

  e2e:
    name: Browser e2e (Playwright + Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Inlined into the client bundle at build time: points the web SDK at the emulators.
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: 'true'
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-lemonade
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-14

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (emulator client config)
        run: npm run build

      - name: Playwright
        run: npx --yes firebase-tools@14 emulators:exec --only auth,firestore --project demo-lemonade "npx playwright test -c playwright.emulators.config.ts"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile-export:
    name: Mobile bundle (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Export JS bundle
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist-${{ matrix.platform }}

  android-module:
    name: Compile Meta Wearables Android module
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate the Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Compile the module
        working-directory: mobile/android
        run: ./gradlew :meta-wearables:compileDebugKotlin --stacktrace
